[package]
name = "flagrant-api"
version.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
flagrant = {path = "../flagrant", version = "0.0.27"}
flagrant-types = {path = "../flagrant-types", version = "0.0.27"}

tokio = {workspace = true}
axum = {workspace = true}
axum-extra = {workspace = true}
sqlx = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
anyhow = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
smallvec = {workspace = true}
toml = {workspace = true}
redis = {workspace = true, optional = true}
tonic = {workspace = true, optional = true}
tonic-prost = {workspace = true, optional = true}
prost = {workspace = true, optional = true}
tokio-stream = {workspace = true, optional = true}

utoipa = {workspace = true}
utoipa-scalar = {workspace = true}

[dependencies.tower-http]
version = "0.5.2"
features = ["add-extension", "compression-full", "trace"]

[build-dependencies]
tonic-prost-build = {version = "0.14.6", optional = true}

[features]
default = ["redis", "grpc"]
redis = ["dep:redis"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream", "dep:tonic-prost-build"]

[[bin]]
name = "flagrant-api"
