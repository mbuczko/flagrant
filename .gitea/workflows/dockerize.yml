name: dockerize

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    container: rustlang/rust:nightly
    steps:
      # actions/checkout and actions/cache are JS-based actions, so `node` must be on
      # PATH inside the job container before any `uses:` step runs. gitea's act_runner
      # is supposed to inject its own node into custom containers automatically, but
      # when that fails (exec: "node": executable file not found) installing a real
      # one ourselves, first, is the reliable workaround.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs protobuf-compiler pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      # rustlang/rust:nightly already ships rustup + a nightly toolchain, so we
      # only need to add the cranelift codegen backend that profile.dev requires.
      - name: Add cranelift codegen backend
        run: rustup component add rustc-codegen-cranelift

      - name: Cache cargo registry and build artifacts
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --workspace

  build-and-push:
    needs: test
    if: gitea.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: docker:27-cli
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE: ${{ gitea.repository }} # owner/repo, must be all lowercase for Docker
    steps:
      # actions/checkout and docker/login-action are JS-based actions, so `node`
      # must be on PATH before any `uses:` step runs - see the same note above.
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ gitea.sha }}
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max
