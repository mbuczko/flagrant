name: dockerize

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  test:
    # skip plain pushes to master: it only needs to run there to gate the tag-triggered
    # publish jobs below (via `needs: test`), and a tag push re-runs it anyway for the
    # same commit, so testing master pushes themselves is redundant.
    if: gitea.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: gitea.rodzinks.pl/michal/flagrant-linux-ci:latest
      credentials:
        username: ${{ gitea.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and build artifacts
        continue-on-error: true
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo nextest run --workspace

  build-docker-image-amd64:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: amd64
    container:
      image: docker:27-cli
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE: ${{ gitea.repository }} # owner/repo, must be all lowercase for Docker
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        env:
          REF: ${{ gitea.ref }}
        run: echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}-amd64
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache-amd64,mode=max

  build-docker-image-arm64:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: arm64
    container:
      image: docker:27-cli
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE: ${{ gitea.repository }}
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        env:
          REF: ${{ gitea.ref }}
        run: echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}-arm64
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/${{ env.IMAGE }}:buildcache-arm64,mode=max

  publish-multi-arch-manifest:
    needs:
      - build-docker-image-amd64
      - build-docker-image-arm64
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: docker:27-cli
      options: -v /var/run/docker.sock:/var/run/docker.sock
    env:
      IMAGE: ${{ gitea.repository }}
    steps:
      - name: Install Node.js
        run: apk add --no-cache nodejs

      - name: Determine release tag
        id: vars
        env:
          REF: ${{ gitea.ref }}
        run: echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Joins the two arch-specific images already in the registry into a single
      # multi-arch manifest list - no rebuild, just registry metadata.
      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ vars.REGISTRY }}/${{ env.IMAGE }}:latest \
            -t ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.tag }} \
            -t docker.io/${{secrets.DOCKERHUB_USERNAME}}/flagrant-api:latest \
            -t docker.io/${{secrets.DOCKERHUB_USERNAME}}/flagrant-api:${{ steps.vars.outputs.tag }} \
            ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}-amd64 \
            ${{ vars.REGISTRY }}/${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}-arm64

  build-freebsd-package:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container:
      image: gitea.rodzinks.pl/michal/flagrant-freebsd-ci:latest
      credentials:
        username: ${{ gitea.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: vars
        env:
          REF: ${{ gitea.ref }}
        run: echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # native-tls-vendored statically embeds OpenSSL instead of linking the target's
      # system libssl - the cross toolchain's sysroot is FreeBSD 13, whose libssl.so.12
      # doesn't exist on newer releases (e.g. FreeBSD 15), so dynamic linking breaks at
      # runtime there. Same reasoning as the Dockerfile's musl build.
      - name: Build flagrant-api and flagrant-cli for FreeBSD
        run: cargo build --release --target x86_64-unknown-freebsd -p flagrant-api -p flagrant-cli --features reqwest/native-tls-vendored

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf dist/flagrant-freebsd-amd64.tar.gz -C target/x86_64-unknown-freebsd/release flagrant-api flagrant-cli

      - name: Publish generic package to Gitea
        env:
          REPO: ${{ gitea.repository }}
        run: |
          OWNER="${REPO%%/*}"
          curl -sSf -u "${{ gitea.actor }}:${{ secrets.REGISTRY_TOKEN }}" \
            --upload-file dist/flagrant-freebsd-amd64.tar.gz \
            "${{ gitea.server_url }}/api/packages/${OWNER}/generic/flagrant-freebsd/${{ steps.vars.outputs.tag }}/flagrant-freebsd-amd64.tar.gz"
