{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flagrant.configSecretName" . }}
  labels:
    {{- include "flagrant.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.existingSecretKey }}: |
    {{- .Values.config.content | nindent 4 }}
{{- end }}
